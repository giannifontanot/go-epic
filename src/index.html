<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Go Epic</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101b42" />
    <!-- Each theme has its manifest (manifest-<theme>.webmanifest, core/theme.ts manifestFor): its colours become the
         installed app's, including Android's bottom bar, when Chrome next updates the app -->
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- The theme chosen in Ajustes (core/theme.ts), set before the app starts so the page never flashes the other look -->
    <script>
      try {
        var bar = { pinkpop: '#fbeaf3', petalpunk: '#1b141f', squeezeme: '#fff6ef', sunburnt: '#fff1e5', smokedcitrus: '#1a1918', office: '#c6c9cd', graphite: '#2b2e33' }[localStorage.getItem('go-epic-theme')];
        if (bar) {
          document.documentElement.dataset.theme = localStorage.getItem('go-epic-theme');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bar);
          document.querySelector('link[rel="manifest"]').setAttribute('href', 'manifest-' + localStorage.getItem('go-epic-theme') + '.webmanifest');
        }
        if (localStorage.getItem('go-epic-red-line') === '1') document.documentElement.dataset.redLine = '';
      } catch (e) {}
    </script>
    <meta name="description" content="Plan your week in blocks, then live each day one task at a time." />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- iPhone / iPad: installed from Safari → Share → Add to Home Screen -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Go Epic" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Go Epic needs JavaScript. / Go Epic necesita JavaScript.</noscript>
  </body>
</html>
