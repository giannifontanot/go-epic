<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Go Epic</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101b42" />
    <!-- Each theme has its manifest (manifest-<theme>.webmanifest, core/theme.ts manifestFor): its colours become the
         installed app's, including Android's bottom bar, when Chrome next updates the app -->
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- The root "/" is the Get Go Epic page (firebase.json serves public/get/index.html there). This shell reaches
         "/" only through the service worker; then anyone who is neither in the installed app nor signed in on this
         device (go-epic-signed-in, kept by core/auth.service.ts, or a Firebase session saved by an older version) goes to
         that page, never to the sign-in screen. -->
    <script>
      // A Firebase session saved before go-epic-signed-in existed (older versions never wrote it): Firebase keeps the
      // signed-in user under firebase:authUser:* in IndexedDB (or localStorage). answer(true/false), or null when the
      // browser does not say within 1.5 s.
      function goEpicSavedSession(answer) {
        var said = false;
        function say(v) { if (!said) { said = true; answer(v); } }
        setTimeout(function () { say(null); }, 1500);
        try {
          if (Object.keys(localStorage).some(function (k) { return k.indexOf('firebase:authUser:') === 0; })) return say(true);
          var open = indexedDB.open('firebaseLocalStorageDb');
          open.onupgradeneeded = function () { open.transaction.abort(); }; // never create the database just to look
          open.onerror = function () { say(false); };
          open.onsuccess = function () {
            var db = open.result;
            try {
              if (!db.objectStoreNames.contains('firebaseLocalStorage')) { db.close(); return say(false); }
              var all = db.transaction('firebaseLocalStorage', 'readonly').objectStore('firebaseLocalStorage').getAllKeys();
              all.onsuccess = function () {
                db.close();
                say(all.result.some(function (k) { return String(k).indexOf('firebase:authUser:') === 0; }));
              };
              all.onerror = function () { db.close(); say(false); };
            } catch (e) { db.close(); say(false); }
          };
        } catch (e) { say(false); }
      }
      try {
        var installed = navigator.standalone === true || ['standalone', 'fullscreen', 'minimal-ui'].some(function (m) {
          return matchMedia('(display-mode: ' + m + ')').matches;
        });
        var signedIn = localStorage.getItem('go-epic-signed-in') === '1';
        if (location.pathname === '/' && !installed && !signedIn && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
          // main.ts waits for this answer: a saved session opens the app (and is remembered), none goes to the page;
          // no answer opens the app, since this shell may be all there is offline.
          window.goEpicGate = new Promise(function (start) {
            goEpicSavedSession(function (has) {
              if (has === false) {
                window.goEpicLeaving = true;
                location.replace('/get/' + location.search + location.hash);
                return start(false);
              }
              try { if (has) localStorage.setItem('go-epic-signed-in', '1'); } catch (e) {}
              start(true);
            });
          });
        }
      } catch (e) {}
    </script>
    <!-- The theme chosen in Ajustes (core/theme.ts), set before the app starts so the page never flashes the other look -->
    <script>
      try {
        var bar = { pinkpop: '#fbeaf3', petalpunk: '#1b141f', squeezeme: '#eef4fc', sunburnt: '#fff1e5', smokedcitrus: '#1a1918', office: '#c6c9cd', graphite: '#2b2e33', goepiclight: '#fbfbfd', goepicdark: '#0a1130' }[localStorage.getItem('go-epic-theme')];
        // the Canvas always wears Epic (Gianni): opened straight there, it starts in Epic too, only the manifest follows the choice
        var canvas = /^\/canvas(\/|$)/.test(location.pathname);
        if (bar) {
          if (!canvas) {
            document.documentElement.dataset.theme = localStorage.getItem('go-epic-theme');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', bar);
          }
          document.querySelector('link[rel="manifest"]').setAttribute('href', 'manifest-' + localStorage.getItem('go-epic-theme') + '.webmanifest');
        }
        if (localStorage.getItem('go-epic-red-line') === '1') document.documentElement.dataset.redLine = '';
      } catch (e) {}
    </script>
    <meta name="description" content="Plan your week in blocks, then live each day one task at a time." />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- iPhone / iPad: installed from Safari → Share → Add to Home Screen -->
    <link rel="apple-touch-icon" href="apple-touch-go-epic.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Go Epic" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Go Epic needs JavaScript. / Go Epic necesita JavaScript.</noscript>
  </body>
</html>
